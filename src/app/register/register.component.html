<div class="register-container">
  <h1>注册</h1>
  <div class="register-card">
    <form [formGroup]="registerForm" (ngSubmit)="submit()">
      <div class="zmkdpw-input-group">
        <label>电子邮箱</label>
        <input name="email" placeholder="电子邮箱" type="email" formControlName="email"/>
        <div *ngIf="fc['email'].errors && isSubmitted" class="error-list">请输入正确的电子邮箱地址</div>
      </div>
      <div style="display: flex">
        <div class="zmkdpw-input-group" style="margin-right: 20px; flex: 1">
          <label>姓氏</label>
          <input name="lastName" placeholder="姓氏" type="text" formControlName="lastName"/>
          <div *ngIf="fc['lastName'].errors && isSubmitted" class="error-list">请输入正确的姓氏</div>
        </div>
        <div class="zmkdpw-input-group" style="flex: 1">
          <label>名</label>
          <input name="firstName" placeholder="名" type="text" formControlName="firstName"/>
          <div *ngIf="fc['firstName'].errors && isSubmitted" class="error-list">请输入正确的名</div>
        </div>
      </div>
      <div class="zmkdpw-input-group">
        <label>昵称</label>
        <input name="nickName" placeholder="昵称" type="text" formControlName="nickName"/>
        <div *ngIf="fc['nickName'].errors && isSubmitted" class="error-list">请输入正确的昵称</div>
      </div>
      <div class="zmkdpw-input-group">
        <label>密码</label>
        <input name="password" placeholder="密码" type="password" formControlName="password"/>
        <div *ngIf="fc['password'].errors && isSubmitted" class="error-list">请输入正确的密码，至少六位</div>
      </div>
      <div class="zmkdpw-input-group">
        <label>确认密码</label>
        <input name="confirmPassword" placeholder="确认密码" type="password" formControlName="confirmPassword"/>
        <div *ngIf="fc['confirmPassword'].errors && isSubmitted" class="error-list">
          <ng-container *ngIf="fc['confirmPassword'].errors['required']">请输入正确的密码</ng-container>
          <ng-container *ngIf="fc['confirmPassword'].errors['notMatch']">两次密码输入不一致</ng-container>

        </div>
      </div>
      <div class="zmkdpw-input-group">
        <label>邀请码</label>
        <input name="secretCode" placeholder="邀请码" type="text" formControlName="secretCode"/>
        <div *ngIf="fc['secretCode'].errors && isSubmitted" class="error-list">请输入正确的邀请码</div>
      </div>
      <button  type="submit" [disabled]="isSubmitting">
        <ng-container *ngIf="!isSubmitting">注册</ng-container>
        <ng-container *ngIf="isSubmitting">
          <i  class="pi pi-spin pi-spinner" style="font-size: 16px; color: #fff"></i>
          注册中...
        </ng-container>
      </button>

    </form>
  </div>
  <div class="hint">已有账号？<a routerLink="/login">登录</a></div>
</div>
