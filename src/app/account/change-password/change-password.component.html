<div class="page-container" style="max-width: 1000px; margin: 90px auto">
  <h1>重置密码</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="password-item">
      <p-floatlabel variant="in">
        <p-password formControlName="oldPassword" inputId="in_label" [toggleMask]="true" [feedback]="false" size="large"/>
        <label for="in_label">旧密码</label>
      </p-floatlabel>
      <div *ngIf="fc['oldPassword'].errors && isSubmitted" class="error-list">请输入旧密码</div>
    </div>
    <div class="password-item">
      <p-floatlabel variant="in">
        <p-password formControlName="confirmPassword" [toggleMask]="true" [feedback]="false" size="large" />
        <label for="in_label">确认旧密码</label>
      </p-floatlabel>
      <div *ngIf="fc['confirmPassword'].errors && isSubmitted" class="error-list">
        <ng-container *ngIf="fc['confirmPassword'].errors['required']">请再次输入旧密码</ng-container>
        <ng-container *ngIf="fc['confirmPassword'].errors['notMatch']">两次密码输入不一致</ng-container>
      </div>
    </div>
    <div class="password-item">
      <p-floatlabel variant="in">
        <p-password formControlName="newPassword"
                    size="large"
                    [toggleMask]="true"
                    [feedback]="true"
                    promptLabel="Choose a password"
                    weakLabel="过于简单"
                    mediumLabel="中等"
                    strongLabel="复杂"
                    promptLabel="输入新密码"/>
        <label for="in_label">新密码</label>

      </p-floatlabel>
      <div *ngIf="fc['newPassword'].errors && isSubmitted" class="error-list">请输入新密码,至少六位</div>

    </div>


    <p-button type="submit" label="{{isSubmitting ? '更改中...' : '确认更改'}}" icon="pi {{isSubmitting ? '' : 'pi-check'}}" iconPos="right" [raised]="true" [disabled]="isSubmitting"/>

  </form>
</div>
