<div class="sidebar-container" [class.open]="visible">
  <div class="sidebar-header">
    <img src="/assets/images/logo2.png" style="border-radius: 50%; width: 40px; height: 40px">
    智瞳诊牧
  </div>
  <div class="sidebar-main">
    <ul class="sidebar-menu">
      <li routerLinkActive="active">
        <a class="sidebar-menu-item" routerLink="/home">
          <i class="pi pi-home"></i>
          <span>控制中心</span>
        </a>

      </li>
<!--      <li routerLinkActive="active">-->
<!--        <a class="sidebar-menu-item" routerLink="/history">-->
<!--          <i class="pi pi-history"></i>-->
<!--          <span>识别记录</span>-->
<!--        </a>-->
<!--      </li>-->
      <li routerLinkActive="active">
        <a class="sidebar-menu-item" routerLink="/images-history">
          <i class="pi pi-image"></i>
          <span>识别记录</span>
        </a>
      </li>
      <li routerLinkActive="active">
        <a class="sidebar-menu-item">
          <i class="pi pi-chart-bar"></i>
          <span>数据分析</span>
        </a>
      </li>
      <li routerLinkActive="active">
        <a class="sidebar-menu-item" routerLink="/upload-and-diagnose">
          <i class="pi pi-upload"></i>
          <span>手动上传</span>
        </a>
      </li>
      <li routerLinkActive="active">
        <a class="sidebar-menu-item" routerLink="/alert-emails">
          <i class="pi pi-bell"></i>
          <span>预警邮件设置</span>
        </a>
      </li>
      <li routerLinkActive="active">
        <a class="sidebar-menu-item" routerLink="/device">
          <i class="pi pi-camera"></i>
          <span>硬件设备</span>
        </a>
      </li>
    </ul>
  </div>
  <div class="sidebar-footer">
    <button (click)="toggleSidebar()">
      <svg *ngIf="visible" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 16 16" class="" role="img" aria-label="Nav Collapse Icon"><path fill="currentColor" d="M11.39 4.818a.5.5 0 0 0-.708 0L7.854 7.646a.5.5 0 0 0 0 .708l2.828 2.828a.5.5 0 0 0 .707 0l.354-.354a.5.5 0 0 0 0-.707L9.62 8l2.122-2.121a.5.5 0 0 0 0-.707z"></path><path fill="currentColor" fill-rule="evenodd" d="M4 1a3 3 0 0 0-3 3v8a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3V4a3 3 0 0 0-3-3zm1 1.5H4A1.5 1.5 0 0 0 2.5 4v8A1.5 1.5 0 0 0 4 13.5h1zm1.5 0v11H12a1.5 1.5 0 0 0 1.5-1.5V4A1.5 1.5 0 0 0 12 2.5z" clip-rule="evenodd"></path></svg>
      <svg *ngIf="!visible" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 16 16" class="" role="img" aria-label="Nav Expand Icon"><path fill="currentColor" d="M4.61 4.818a.5.5 0 0 1 .708 0l2.828 2.828a.5.5 0 0 1 0 .708l-2.828 2.828a.5.5 0 0 1-.707 0l-.354-.354a.5.5 0 0 1 0-.707L6.38 8 4.257 5.879a.5.5 0 0 1 0-.707z"></path><path fill="currentColor" fill-rule="evenodd" d="M12 1a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H4a3 3 0 0 1-3-3V4a3 3 0 0 1 3-3zm-1 1.5h1A1.5 1.5 0 0 1 13.5 4v8a1.5 1.5 0 0 1-1.5 1.5h-1zm-1.5 0v11H4A1.5 1.5 0 0 1 2.5 12V4A1.5 1.5 0 0 1 4 2.5z" clip-rule="evenodd"></path></svg>
    </button>
  </div>
</div>
