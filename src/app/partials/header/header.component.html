<div class="header-wrapper" [ngClass]="isTransparentMode || isTransparentMode === undefined ? 'navbar-transparent' : ''">
  <div class="nav-item-wrapper">
    <a [routerLink]="'/home'">首页</a>

    <a [routerLink]="'/timeline'">时间轴</a>

    <a [routerLink]="'/posts'">帖子</a>
    <a [routerLink]="'/places'">去过</a>

    <!--    <a [routerLink]="'/messages'">消息</a>-->
  </div>
  <p-button (click)="toggleDrawer()" icon="pi pi-bars" class="toggle-drawer-btn"/>

  <p-menu #menu [model]="items" [popup]="true" class="flex justify-center" styleClass="w-full md:w-60">
    <ng-template #item let-item>
      <a pRipple class="flex items-center p-menu-item-link" *ngIf="!item.icon.includes('sign-out')" routerLink="{{item.link}}">
        <span [class]="item.icon"></span>
        <span class="ml-2">{{ item.label }}</span>
        <p-badge *ngIf="item.badge" class="ml-auto" [value]="item.badge" />
<!--        <span *ngIf="item.shortcut" class="ml-auto border border-surface rounded bg-emphasis text-muted-color text-xs p-1">{{ item.shortcut }}</span>-->
      </a>
      <a pRipple class="flex items-center p-menu-item-link" *ngIf="item.icon.includes('sign-out')" (click)="logout()">
        <span class="pi pi-sign-out"></span>
        <span class="ml-2">退出登录</span>
      </a>
    </ng-template>


    <ng-template #end>
      <div pRipple style="width: 100%" class="relative overflow-hidden bg-transparent flex items-start p-2 pl-4 rounded-none transition-colors duration-200">
        <p-avatar *ngIf="!user.user.avatarUrl" image="https://zmk-dpw-s3-bucket.s3.ap-southeast-1.amazonaws.com/static/default-user-image.png" class="mr-2" shape="circle" />
        <p-avatar *ngIf="user.user.avatarUrl" image="{{user.user.avatarUrl}}" class="mr-2" shape="circle" />

        <span class="inline-flex flex-col">
                    <span class="font-bold">{{user.user.firstName}}</span>
                </span>
      </div>
    </ng-template>
  </p-menu>
  <p-button (click)="menu.toggle($event)" icon="pi pi-user" label="我的"  severity="primary" styleClass="userCenterBtn"/>
</div>
