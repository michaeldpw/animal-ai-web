  <ng-container *ngIf="!isLoading">
    <div *ngIf="posts.length > 0">
      <a *ngFor="let post of posts" class="post-item" routerLink="/posts/{{post['id']}}">
        <div>
          <div class="author">
            <img *ngIf="post['author']['avatarUrl']" [src]="post['author']['avatarUrl']"/>
            <img *ngIf="!post['author']['avatarUrl']"
                 src="https://zmk-dpw-s3-bucket.s3.ap-southeast-1.amazonaws.com/static/default-user-image.png"/>
            <div class="author-name">{{post['author']['nickName']}}</div>
          </div>
          <div *ngIf="post['title']" class="cover-title">{{post['title']}}</div>
<!--          <div *ngIf="post['content']" [innerText]="post['content']" class="cover-content">-->
<!--          </div>-->

          <div class="cover-time">{{post['updatedAt'] | date:'yyyy年MM月dd日 HH:mm'}}</div>
        </div>
      </a>
      <div style="margin-top: 40px">
        <p-paginator  (onPageChange)="onPageChange($event)"
                      [rows]="pageSize"
                      [first]="(currentPage - 1) * pageSize"
                      [totalRecords]="totalRecords" />
      </div>

    </div>

    <div *ngIf="posts.length === 0">
      还没有内容
    </div>
  </ng-container>


</div>
