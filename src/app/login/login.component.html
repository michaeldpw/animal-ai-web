<div class="login-container">
  <h1>登录</h1>
  <div class="login-card">
    <form [formGroup]="loginForm" (ngSubmit)="submit()">
      <div class="zmkdpw-input-group">
        <label>电子邮箱</label>
        <input name="username" placeholder="电子邮箱" type="email" formControlName="email"/>
        <div *ngIf="fc['email'].errors && isSubmitted" class="error-list">请输入正确的电子邮箱地址</div>
      </div>
      <div class="zmkdpw-input-group">
        <label>密码</label>
        <input name="password" placeholder="密码" type="password" formControlName="password"/>
        <div *ngIf="fc['password'].errors && isSubmitted" class="error-list">请输入正确的密码</div>
      </div>
      <button  type="submit" [disabled]="isSubmitting">
        <ng-container *ngIf="!isSubmitting">登录</ng-container>
        <ng-container *ngIf="isSubmitting">
          <i  class="pi pi-spin pi-spinner" style="font-size: 16px; color: #fff"></i>
          登录中...
        </ng-container>
      </button>

    </form>
  </div>
  <div class="hint">还没有账号？<a routerLink="/register">注册</a></div>
</div>
