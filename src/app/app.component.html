

<div class="app-container">
  <app-header *ngIf="user.user?.id"></app-header>
  <router-outlet></router-outlet>
</div>
<p-drawer #drawerRef [(visible)]="isDrawerOpen" (visibleChange)="drawerStateChanged($event)">
  <ng-template #headless>
    <div class="flex flex-col h-full">
      <div class="flex items-center justify-between px-6 pt-4 shrink-0">
                <span class="inline-flex items-center gap-2">
                    <span class="font-semibold text-2xl text-primary">ZMK∞DPW</span>
                </span>
                <span>
                    <p-button type="button" (click)="closeCallback($event)" icon="pi pi-times" rounded="true" outlined="true" styleClass="h-8 w-8"></p-button>
                </span>
      </div>
      <div class="overflow-y-auto">
        <ul class="list-none p-4 m-0">
          <li>
            <div
              pRipple
              pStyleClass="@next"
              enterFromClass="hidden"
              enterActiveClass="animate-slidedown"
              leaveToClass="hidden"
              leaveActiveClass="animate-slideup"
              class="p-4 flex items-center justify-between text-zinc-600 cursor-pointer p-ripple"
            >
              <span class="font-medium">菜单</span>
            </div>
            <ul class="list-none p-0 m-0 overflow-hidden">
              <li>
                <a (click)="menuItemClicked('/home')"  pRipple class="flex items-center cursor-pointer p-4 rounded-border text-zinc-600 duration-150 transition-colors p-ripple">
                  <i class="pi pi-home mr-2"></i>
                  <span class="font-medium">首页</span>
                </a>
              </li>
              <li>
                <a (click)="menuItemClicked('/timeline')" pRipple class="flex items-center cursor-pointer p-4 rounded-border text-zinc-600 duration-150 transition-colors p-ripple">
                  <i class="pi pi-calendar mr-2"></i>
                  <span class="font-medium">时间轴</span>
                </a>
              </li>
              <li>
                <a
                  (click)="menuItemClicked('/posts')"
                  pRipple
                  pStyleClass="@next"
                  enterFromClass="hidden"
                  enterActiveClass="animate-slidedown"
                  leaveToClass="hidden"
                  leaveActiveClass="animate-slideup"
                  class="flex items-center cursor-pointer p-4 rounded-border text-zinc-600 duration-150 transition-colors p-ripple"
                >
                  <i class="pi pi-book mr-2"></i>
                  <span class="font-medium">帖子</span>
                </a>

              </li>
            </ul>
          </li>
        </ul>
        <ul class="list-none p-4 m-0">
          <li>
            <div
              pRipple
              pStyleClass="@next"
              enterFromClass="hidden"
              enterActiveClass="animate-slidedown"
              leaveToClass="hidden"
              leaveActiveClass="animate-slideup"
              class="p-4 flex items-center justify-between text-zinc-600 cursor-pointer p-ripple"
            >
              <span class="font-medium">我的</span>
            </div>
            <ul class="list-none p-0 m-0 overflow-hidden">
              <li>
                <a
                  (click)="menuItemClicked('/account/profile')"
                   pRipple class="flex items-center cursor-pointer p-4 rounded-border text-zinc-600 duration-150 transition-colors p-ripple">
                  <i class="pi pi-user mr-2"></i>
                  <span class="font-medium">主页</span>
                </a>
              </li>
              <li>
                <a
                  (click)="menuItemClicked('/account/update-profile')"
                  pRipple class="flex items-center cursor-pointer p-4 rounded-border text-zinc-600 duration-150 transition-colors p-ripple">
                  <i class="pi pi-pencil mr-2"></i>
                  <span class="font-medium">修改资料</span>
                </a>
              </li>
              <li>
                <a
                  (click)="menuItemClicked('/account/change-password')"
                  pRipple class="flex items-center cursor-pointer p-4 rounded-border text-zinc-600 duration-150 transition-colors p-ripple">
                  <i class="pi pi-key mr-2"></i>
                  <span class="font-medium">修改密码</span>
                </a>
              </li>
              <li>
                <a (click)="logout()" pRipple class="flex items-center cursor-pointer p-4 rounded-border text-zinc-600 duration-150 transition-colors p-ripple">
                  <i class="pi pi-sign-out mr-2"></i>
                  <span class="font-medium">退出登录</span>
                </a>
              </li>
            </ul>
          </li>
        </ul>
      </div>
      <div class="mt-auto">
        <hr class="mb-4 mx-4 border-t border-0 border-surface" />
        <a pRipple class="m-4 flex items-center cursor-pointer p-4 gap-2 rounded-border text-zinc-600 duration-150 transition-colors p-ripple">
          <p-avatar image="{{user.user.avatarUrl? user.user.avatarUrl : 'https://zmk-dpw-s3-bucket.s3.ap-southeast-1.amazonaws.com/static/default-user-image.png'}}" shape="circle" />
          <span class="font-bold">{{user.user.nickName}}</span>
        </a>
      </div>
    </div>
  </ng-template>
</p-drawer>


<p-toast position="top-center"
         [breakpoints]="{ '600px': { width: '90%' } }"
         life="4000" p-toast-icon-size="80px" />
